  4-2-class-legible-blips: done  # 2026-08-04 dev-auto cycle 41 (0.17.41); PV 19->20; amendments 7-14 ratified pre-implementation (TRUE-SCALE silhouette blips supersede the DESIGN.md px table/floor-clamp/3x ML notch; 3-paint persistence; decoy = radar reflector at frozen pose, speed 0; algorithmic luminance floor)
  4-3-the-gunnery-conversation: done  # 2026-08-04 dev-auto cycle 43 (0.17.43); PV 21->22; amendments 15-20 ratified pre-implementation (muzzle flash carries to a DERIVED SIGHT*1.5 495u halo, LOS-blocked — not radar range, not map-wide; fall-of-shot splash SELF-PRIVATE and gun-family only, resolving FR16 "own" vs EXPERIENCE.md:181's unqualified line in FR16's favor; the Hit Call is SHOOTER-ONLY and knowingly SUPERSEDES the boom row's "hit confirmation beyond sight would leak contact presence" rule for the owner-hit case, because the ratified decoy oracle depends on it; Hit Call covers ALL ordnance incl. mines; the flash is NEUTRAL — position only, never who or which weapon, DESIGN.md:239 beating UX-DR7 for this signal; flash is gun-family only, upholding the torpedo's shipped "quiet weapon" status). Three declared perception-invariant exceptions, each with its own independent oracle. Also promoted `muzzle`/`spark` OUT of isJuiceEffect (they are information now, so they survive motion=off) — Story 4-8 inherits that changed split
  # INTERSTITIAL 2026-08-04 (dev-auto cycle 45, 0.17.45) — THE PUBLIC REGISTER (global kill feed).
