  4-4-wounded-smoke: done  # 2026-08-05 dev-auto cycle 49 (0.17.49); PV 24->25; amendments 40-50 ratified pre-implementation. `sm` is the FIFTH declared perception-invariant exception (joining 4.3's sp/hc/mz and cycle 45's sunk) and is a first TWICE OVER: the first enemy-HP-derived information ever put on the wire, and the first PERSISTENT fog-piercing signal (the other four are one-tick pulses). Eric's own question — "don't we have the HP bar turning yellow or red already?" — reframed the story mid-gate and moved him OFF his first answer (truesight-only texture) onto a real fog-piercing channel: smoke tiers ARE the own-vitals rail bands (light <50%, heavy <25%), so `CONFIG.damageBands` was PROMOTED to shared and `CLIENT_CONFIG.vitals` now REFERENCES it — exactly one set of 0.5/0.25 exists in the codebase and a future rail retune moves the smoke with it. Reach reuses `CONFIG.vision.muzzleFlash` (495u) rather than adding a fourth vision constant, so all new disclosure happens in the 330-495u annulus and radar stays the only long-range sensor. The plume is ATTACHED and drifting (not a track), NEUTRAL (no id/hue/class for anyone, so no correlation handle exists on the wire and the client synthesizes persistence the phosphor way), islands BLOCK it, you see your OWN plume, and every hull with hp smokes incl. drones. No audio twin — 4.7 owns that.
  4-5-the-foghorn: done  # 2026-08-05 dev-auto cycle 50 (0.17.50); PV 25->26; amendments 51-61 ratified (51-59 at a pre-implementation gate, 60-61 post-review). The foghorn SHIPS — 4-5 does NOT defer, and amendment 4's open question is CLOSED: it grew its own bearing surface. `fh` is the SIXTH declared perception-invariant exception and the FIRST signal whose payload varies BY OBSERVER in substance rather than by a flag — a fogged listener gets bearing + volume tier ONLY (no position, no id, no correlation handle), the honker gets {self}, a spectator gets position. Volume tiers scale with the LISTENER's effective ranges (sightOf / max(1.5*sight, muzzleFlash) / radarRange, max()-clamped monotone so an intel build hears farther and DAZZLE CANNOT ALSO DEAFEN). ISLANDS MUFFLE BY EXACTLY ONE TIER (1->2, 2->3, 3->inaudible) — the FIRST dent in the 2026-08-02 "islands block every sensor" law, and Eric reversed his own full-carve-out answer mid-run to get it, because terrain must keep working as a hiding mechanism if a bearing-grade sound sensor is ever revived. Visual twin is a SCREEN-EDGE CHEVRON (deliberately foghorn-shaped, not sensor-shaped — a revived 4-1 inherits nothing). Key is F as reserved, closing UX open question #20; 1.5s cooldown; a denied press is COMPLETELY SILENT (amendment 60 — the horn was the only `denied` site in the client with no visual twin, so Eric dropped the orphan cue rather than invent a surface). THE WIRE CARRIES A HORN VARIANT ID — a knowing, narrow break with amendments 19/45's neutral-signal rule, justified because an emote is information a captain SPENDS, not leaks — behind a sample-capable audio seam with EXACTLY ONE synthesized horn shipped. ADDING HORN VARIANTS IS ERIC-GATED CONTENT. Own honks are never client-predicted.
  4-6-the-bounty: backlog  # SCOPE CHANGED 2026-08-05 (cycle 51, amendment 71): DESIGN.md:237's Bounty Bloom is specced as "an expanding ring in the leader's personal color around their class blip at true position" — and `HC_RADAR_GRAMMAR=return` deletes BOTH of those channels (personal hue on radar, and the class blip). 4-6 must resolve it, and Eric declined to rule at cycle 51's gate: "I don't know honestly because I haven't addressed the 'bounty' story at all yet. I'm not sure I want the kill leader's position to be known globally, for example." Note the deeper question that raises is NOT a rendering question — whether a global position broadcast should exist at all is a fog-of-war call that would touch the master perception invariant's declared-exception list (now 6 after 4-5's `fh`: sp/hc/mz/sunk/sm/fh). Options surfaced and NOT chosen: a hueless expanding ring on an anonymous return (keeps "someone is leading, over there", loses "who"), a sanctioned identity exception on radar, or dropping the feature. See deferred-work.md, cycle-51 block.
