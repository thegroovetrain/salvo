    action: "FRACTAL ISLAND GENERATION — LANDED as interstitial dev-auto cycle 51 (0.17.51, spec-fractal-island-generation.md): the circle-packing map generator is REPLACED with a fractal capsule-offset generator (Eric ruling 2026-08-05, 'islands become true polygon coastlines' — the circle era is over). Each landmass is a 1-3 point SKELETON (1pt=blob, 2-3pt=ridge) wrapped in a boundary polygon whose outward offset comes from PERIODIC MIDPOINT DISPLACEMENT clamped to `m ∈ [0.45, 1.6]` (`shared/src/sim/islandShape.ts`); that clamp keeps every polygon STAR-SHAPED about its skeleton, which makes push-out escape structural (no concave stuck-traps) and makes an intra-island lagoon geometrically impossible — both invariants fall out of the clamp rather than needing separate enforcement. `Island` still carries `{x,y,r}` as its BOUNDING CIRCLE (structurally assignable to `Circle`, so the ~20 consumer call sites keep compiling and get broadphase for free), plus `poly`/`skeleton`/`core`; every consumer was ported through the new `shared/src/sim/island.ts` seam — bounding-circle broadphase first, exact polygon test second, all polygon math delegated to `silhouette.ts` (still the one polygon library; no second was authored). Archipelago channels come from GAPS BETWEEN separate polygons (`CHANNEL_MIN` 48u), never from a concavity inside one — a single polygon can't have a channel without breaking star-shapedness. One navigability grid (32u cells, eroded by widest-hull half-beam + margin, flood-filled from the spawn ring) enforces three invariants in one deterministic pass — no enclosed lagoons, no unreachable water, no channel narrower than the widest hull — with spawn-ring clearance (64u) as the fourth, checked separately. Land coverage lands in the ratified 3-5% band (measured 4.0-4.8% across the seed sample), landmass count runs 9 at playerCap 2 rising to ~44 at playerCap 20. PV 25 -> 26: the same seed now builds a different ocean, so an un-bumped old client would desync catastrophically. `npm run check` and the polygon-fixture regression suite (map invariants across >=100 seeds x roster sizes 2/5/10/20, collision cove-escape, LOS through channels, shell-into-cove-mouth) all green; a wave-2 review-gate catch (float-dust EPS miss on the radius-0 polygon path — 38.5% of shell hits and 31.8% of LOS checks silently passing through solid land) was fixed and pinned before this cycle closed. Client presentation: `render/map.ts` draws the SAME verts the sim collides/LOS-tests against — no decorative smoothing"
