strophically. `npm run check` and the polygon-fixture regression suite (map invariants across >=100 seeds x roster sizes 2/5/10/20, collision cove-escape, LOS through channels, shell-into-cove-mouth) all green; a wave-2 review-gate catch (float-dust EPS miss on the radius-0 polygon path — 38.5% of shell hits and 31.8% of LOS checks silently passing through solid land) was fixed and pinned before this cycle closed. Client presentation: `render/map.ts` draws the SAME verts the sim collides/LOS-tests against — no decorative smoothing"
