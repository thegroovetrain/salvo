  # THE RADAR PHYSICS ARC (stories 4-9 .. 4-12), added 2026-08-06 from a live Eric design
  # conversation opened right after cycle 59 landed island elevation. DESIGN CONTRACT: amendments
  # 100-118 in epic-4-context-amendments.md — those are the rulings, the specs derive from them, and
  # on any apparent conflict the amendments win and the conflict gets REPORTED, not resolved.
  # ERIC: these are NEXT, before anything else in the epic ("I am 100% doing them next"), and they
  # are nonblocking on 4-6/4-7/4-8. Sequence within the arc is 4-9 -> 4-10 -> 4-11 -> 4-12.
  # THREE THINGS THAT WILL BITE WHOEVER PICKS THESE UP:
  #  (a) AMENDMENT 100 IS SUPERSEDED IN PART BY 115. Realism is the IDEA SOURCE and the tiebreaker
  #      on presentation; FUN WINS ON MECHANICS. Eric: "im not really married to realism, i want
  #      semi-realism but fun gameplay." Do not cite 100's "realism is the default" clause.
  #  (b) COLOUR IS INTENSITY, NEVER CATEGORY (105, re-ratifying 77). The supplied consumer-radar
  #      colour taxonomy is a BASIS for extrapolation, not a spec — most of its entries have no
  #      referent in this game. Object type may reach colour ONLY through physical properties.
  #  (c) LAND IS SACRED (116). Sensor upgrades buy REACH; nothing buys past terrain. The mast-height
  #      card was proposed and REJECTED — at a stack matching the shipped intelRadar multiplier it
  #      would have deleted hard cover from the map. Four sensor cards are PARKED in amendment 117
  #      (Intel Range consolidation, Doppler-as-a-mode, the low-band set, Active Sonar on R); none
  #      may be built inside this arc without a fresh Eric ruling (amendment 112).
  4-9-the-eighths-ladder: done  # 2026-08-07 dev-auto cycle 60 (0.17.60); PV 29->30; amendments 121-125 (121-123 at a pre-implementation gate, 124-125 post-review). INTEL RANGE is the one ruler and every sensor boundary is a named eighth of it, all SIGHT-anchored in the existing derivation style: 3/8 `detect` 247.5u (NEW), 4/8 `sight` 330u, 5/8 `muzzleFlash` 412.5u (MOVED from 6/8), 7/8 `farRadar` 577.5u (NEW, DELIBERATELY UNCONSUMED — 4-10's calibration target; comparing against it in a paint path violates amendment 105), 8/8 `radar` 660u. THE MUZZLE/SMOKE ANNULUS HALVED (165u -> 82.5u) because amendment 42 reuses that one constant for wounded smoke — intended, Eric ruled the band as "muzzle/smoke"; the flash still masks the D1 back-dated spawn since 412.5 > 330. MINES AND TORPEDOES DETECT AT 247.5u VIA A NEW SIBLING GATE: `pointDetected` never narrows `pointSighted`, which has NINE call sites — exactly THREE moved (mine, ballisticSignal's `torp` branch, torpU) and shells/decoys/booms/bursts/sunk-witness/spawns are byte-identical. SHELLS DO NOT MOVE. Detect is OBSERVER-SCALED (amendment 121, Eric's pick over a flat rung): dazzle halves it, intelTruesight widens it. THE FOGHORN REBASED ONTO THE LADDER as 8 volume regions of the LISTENER'S INTEL RANGE (amendment 122, Eric's pick over quarters), which RETIRES amendment 53's max() clamps — "dazzle cannot deafen" is now true BY CONSTRUCTION, since dazzle scales sight and never radarRange; the knowing trade is that hearing widens with intelRadar rather than intelTruesight. Amendment 54's one-step island muffle survives as max(5, band + 2). THE WIRE IS FLOORED AT BAND 4 (amendment 124, review gate): bands 1-4 render identically, so shipping the distinction was pure cheat-readable surplus — standing principle, THE WIRE MAY CARRY NO FINER RESOLUTION THAN THE PRESENTATION CONSUMES. Review gate also fixed three defects worth knowing (amendment 125): dazzle was never plumbed into the projectile renderer while the server gates on the dazzle-scaled sightOf (the amendment-81 class again, now closed for shells too); the mz/sm perception oracle was passing VACUOUSLY because an upper-bound-only oracle cannot detect a channel getting smaller; and the detect cull was applied to the OWNER's own torpedo on a rationale false for owners (now enemy-only). Evidence: 3376 tests, weaponsSmoke leaksBeyondDetect=0. SUPERSEDED BACKLOG NOTE follows: Amendment 113 — INTEL RANGE is one ruler and every sensor boundary is an eighth of it. TWO RULED CHANGES TO SHIPPED CONSTANTS: muzzle-flash carry moves 6/8 -> 5/8 (SIGHT*1.5 -> SIGHT*1.25, 495u -> 412.5u) and, because amendment 42 reuses that one constant rather than forking a fourth, WOUNDED SMOKE REACH MOVES WITH IT — intended, Eric ruled the band as "muzzle/smoke". Mines and torpedoes get their own DETECT range at 3/8 (247.5u), replacing the truesight gate they share today in pointSighted; Eric: "lets split the difference and say its 3/8... Torpedoes and mines especially need buffs." SHELLS DO NOT MOVE (a torpedo is a wake under the surface, a shell is in the air). Also re-examine the foghorn volume tiers, which derive from max(1.5*sight, muzzleFlash) per amendment 53 and therefore move too. zone.test.ts must pin the NEW derivations and the ordering detect < sight < muzzleFlash < radar. PV bump only if a stale client would misrender — assess, don't assume.
  4-10-the-physical-return-model: done  # 2026-08-07 dev-auto cycle 61 (0.17.61); PV UNCHANGED at 30; amendments 127-137. CLIENT-ONLY — no wire change, no server change, `silhouette` grammar byte-identical. ONE model replaces the lookup: per-material reflectivity x falloff by target GEOMETRY (point/ship 1/d^4, surface/coast+surf+clutter 1/d^3, volume/storm 1/d^2), in `client/src/render/radarFalloff.ts`, which every source calls. The curve generalizes the shipped one — `floor + (1-floor)/(1 + (d/ref)^n)` — so n=1 reproduces cycle 52's hyperbola exactly and that identity is the pinned safety net. THIS CYCLE IS `CONFIG.vision.farRadar`'s FIRST AND ONLY CONSUMER and it consumes it by FITTING (fitPointRef -> pointRef 558.505u, so a Mine Layer broadside crosses red->blue exactly at 577.5u as a consequence of the curve, never a branch — grep of client/src/render is empty). Coast strength now MULTIPLIES terrain height (sampleHeight over the cycle-59 raster) into the existing depth solidity rather than replacing it (amendment 129), so amendment 78's big red mass survives and height only decides how red. Surf is a seaward near-face fringe from the same island bake; sea clutter is a speckled green haze; the storm paints its WALL, not its area. `ship.attenHalfRange` DELETED (amendment 134) — an intelRadar boon now buys REACH only, and no live observer stat reaches the rasterizer at all. FOUR THINGS FOR THE NEXT AGENT: (a) **a bound proved at NOMINAL is not proved** (amendment 135) — noiseMul multiplies by up to 1.3 AFTER the bound, and surf + storm both shipped over their band ceiling because their bounds omitted it while every guarding test ran the noise-OFF fixture; (b) clutter is tuned to sit ON a threshold on purpose (straddles bands[0].at so noise speckles it; safely above = solid disc, safely below = invisible, and the first implementation shipped invisible); (c) the STORM WALL has NO island LOS deliberately — ledgered to 4-11, which owns occlusion; (d) amendment 98 caught a one-frame weather collapse (3,574 lit texels -> 17, ~every other revolution) that no pure-rasterizer test could see. Measured 1.70 ms at 0.5x zoom, inside the 2.0 ms gate. SUPERSEDED PRIOR NOTE: Cycle 60 of the arc; amendments 105/106/118. ONE model: reflectivity coefficient x falloff by target GEOMETRY (point 1/d^4, surface 1/d^3, volume 1/d^2). Covers terrain-height-driven coast colour (reads the cycle-59 raster), surf fringe, sea clutter, and storm returns. CALIBRATION TARGET (118): tune the curve so a mid-size hull crosses red->blue at 7/8 intel range (577.5u) — and the crossover must EMERGE from the curve; an `if (d > 577.5)` in the paint path is the wrong implementation and violates 105. The amendment-106 coefficient table is an explicit assistant handwave, expected to be tuned rather than adopted. CLIENT-ONLY: no wire change, no server change, PV unchanged, silhouette grammar untouched. Amendment 99's standing rule applies — measure per-frame cost at BOTH zoom extremes and report it.
  4-11-height-aware-radar-shadows: backlog  # Cycle 61 of the arc; amendments 102/104/107/114 + resolves open 103 and 109. Occlusion stops being binary: shadowLength = (radarRange^2 / 4) * (1 - h0/H) / d0, infinite when h0 >= H. NOTE THE INVERSION — closer to a low island = LONGER shadow, so coast-hugging costs you a blind wedge; an implementation reproducing the opposite direction is a bug (amendment 102 records the corrected derivation and why the first one was wrong). R and H are FIXED constants, never derived from a map's terrain distribution (114 — Eric rejected the per-seed percentile explicitly). ONE shared pure function called by BOTH signals.ts and radarHeatmap.ts; a second implementation is a desync or a leak. THE LANDMINE (why 103's pin must be a build-failing assertion): radarRange drives gun/cannon/starShells rangeU, so an unpinned R lets a shadow-feel tweak silently rebalance every gun. Shadow must RENDER, and render as NO DATA rather than empty water. PERF: at sweepRpm 15 the beam advances ~4.5 deg/tick, so only the swept wedge needs marching (~9 rays/observer/tick at 0.5 deg) and the cycle-59 max-height pyramid exists to make open water cheap — MEASURED, not assumed. This is the only story in the arc with real server cost.
  4-12-radar-wakes: backlog  # Cycle 62 of the arc; amendments 109/110. A wake paints as a weak SURFACE return under 4-10's model, carrying course and recency WITHOUT identity. MUST RESOLVE 109's FORK EXPLICITLY: client-synthesized trail behind paints already held (no wire, no server, wake never outlives its ship) vs server-owned wake state with its own lifetime (a genuinely new information channel — you find a track with nothing attached — plus a new wire row and a new perception surface). If server-owned, it is a declared registry row with its own independently reimplemented oracle. Also extends the on-water wake render per Eric (longer wakes, displaced water at the hull sides). TORPEDO WAKES STAY OUT (110): CONFIG.torpedo's "Never painted by radar" is untouched here, and reversing it is a balance ruling Eric owns separately — he tabled it deliberately ("lets table this specifically for now and play it by ear later").
