  # excludes dist <= sightRange — it is delivered as a full Contact instead), and that is a
  # perception-invariant surface that MUST NOT CHANGE. So sighted ships are painted CLIENT-side,
  # synthesized from the Contact (which carries cls + heading, all `perpendicularExtent` needs).
  # Discloses nothing — a sighted hull is already fully visible. The sweep still gates creation.
  # The two sources are exact complements off ONE radius (`fogHoleRadiusU`), which therefore keeps a
  # job but changes it: source SELECTOR, not suppressor — and the dazzle plumbing from cycle 54 is
  # now load-bearing for CORRECTNESS, since a dazzled client would otherwise synthesize an annulus
  # the server had already begun blipping. Pinned by a 1-660u total-partition test.
  # KNOWN ARTIFACT, inherent and not fixable client-side: under HC_RADAR_IDENTITY=pseudonym (the
  # PRODUCTION setting) wire blips carry trk-xxxx while contacts carry the real ship id, so a hull
  # crossing the sight boundary can briefly hold TWO ghost trains (<=6). Joining them would require
  # disclosing the pseudonym mapping, which is the thing anonymization exists to prevent. In roster
  # identity the keys are identical and the cap is shared.
  # Amendment 91 DEFERS the matching projectile work to its own cycle: painting shells on radar is
  # NOT a render change (ballistics are revealed only inside sight today), so it needs server-side
  # disclosure, a PV bump, and the no-range-derivable-field rule held at the wider radius.
  # INTERSTITIAL 2026-08-06 (dev-auto cycle 55, 0.17.55) — A PAINT IS A HISTORICAL RECORD.
  # Amendments 83-87. Client-only; PV unchanged at 28. Corrects cycle 54's EVALUATION TIME (its
  # intent stands): the per-cell sight test ran in `writeCell` against the LIVE grid anchor every
  # frame, so an island cell already inside the swept arc lit up the moment the observer moved away
  # — painting with no sweep, which Eric ruled out flatly: "THE RADAR SWEEP IS THE ONLY THING THAT
  # PAINTS. EVER." The fix freezes the observer position + sight radius onto each PAINT at creation
  # and tests against those, never live state. This follows precedent rather than inventing one:
  # ShipPaint already froze bearing/dist (which is why range attenuation never changed as you sailed
  # away) and IslandPaint.cover already baked intensity and faceShadow from the observer at paint
  # open — the sight verdict simply joins them. HeatGrid's live obsX/obsY/sightR2 are DELETED.
  # THE GOVERNING INVARIANT, and the thing to check first for any new radar behavior (amendment 83):
  # a paint is a historical record — position, intensity, band, and whether a cell paints at all are
  # decided ONCE at creation; only alpha changes afterward, via time-based phosphor decay
  # (blipAlpha over sweepPeriodMs x persistSweeps, ~12s; range and beam play no part, so anything
  # leaving radar range still fades out on its own).
  # ACCEPTED CONSEQUENCE, not a regression (amendment 86): a decaying ghost MAY sit inside the sight
  # bubble if it was legitimately swept from outside and the observer then closed on it. Erasing it
  # would reintroduce the very live re-evaluation this cycle removes. Pinned by test.
  # INTERSTITIAL 2026-08-06 (dev-auto cycle 54, 0.17.54) — THE SIGHT-BUBBLE RADAR GATE.
  # Amendments 80-82. Client-only; PV unchanged at 28. Closes an inconsistency cycle 53 left: ship
  # echoes never appeared inside truesight (the SERVER's `blipGate` has always excluded dist <=
  # sightRange, since a sighted hull is a full Contact) but island coverage is client presentation
  # off the map seed and had no sight term, so coastline painted straight through the bubble.
  # Eric closed it toward NONE — inside truesight you are LOOKING, and the scope adds nothing.
  # THE GATE IS PER-CELL, NOT PER-OBJECT, which is the load-bearing detail: a straddling island or a
  # hull at the boundary still paints the portion OUTSIDE sight. That is only expressible because
  # amendment 76 moved to per-pixel intensity — a polygon carries one fill and would have had to be
  # wholly in or wholly out. Cutoff calls `fogHoleRadiusU()` itself rather than re-deriving it, so
  # the suppression edge IS the drawn fog hole; dazzle had to be plumbed into the radar (it reached
  # only the fog before), or a dazzled observer would get a shrunken hole against an unshrunken
  # suppression disc — a dead annulus, fogged AND unpainted. Gate lives at STAMP time, not bake:
  # island coverage is cached per beam revolution while the observer moves continuously.
  # INTERSTITIAL 2026-08-05 (dev-auto cycle 53, 0.17.53) — THE RADAR HEATMAP CORRECTION.
  # Amendments 76-79. Client-only; PV UNCHANGED at 28. Eric's live feedback on cycle 51's return
  # grammar, and it is a GRAMMAR replacement, not a tuning pass: the per-blip POLYGON model is gone.
  # Two complaints, one root cause — a polygon carries ONE fill, so color became a per-OBJECT label
  # (and `ext` legitimately swings with aspect, so the same hull really did change color as it
  # turned), and an island could only be APPROXIMATED by scattering small polygons along its arc.
  # Returns are now rasterized into a WORLD-ANCHORED intensity grid (6u cells over 2x radar range,
  # origin snapped to a whole cell so a coastline does not shimmer as you steam past) and quantized
  # into EXACTLY THREE colors with NO blending: green "could be something tiny" / blue "probably a
  # thing, but fuzzy" / red "definitely a thing". A single object now spans all three — that is the
  # headline requirement and it is pinned by test. History lives in a PAINT LIST re-rasterized every
  # frame, never a decayed-in-place buffer (the observer moves, so in-place would smear or drag).
  # ISLANDS PAINT AS SOLID MASSES OFF THEIR REAL `poly` — this also FIXES a defect cycle 52 created
  # silently: `Island` is structurally assignable to `Circle`, so the radar kept compiling and its
  # tests kept passing while painting the BOUNDING CIRCLE, which can sit well offshore of a fractal
  # coastline. Guard test fails by construction against the old behavior.
  # INTERSTITIAL 2026-08-05 (dev-auto cycle 51, 0.17.51) — THE RADAR REALISM CYCLE. PV 26->27.
  # Landed in PARALLEL with Story 4-5 (the foghorn): both branched from PV 25 and both claimed 26,
