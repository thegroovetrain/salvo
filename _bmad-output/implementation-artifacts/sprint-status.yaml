lisecond re-tessellation); `radarHeatmap.ts`'s `inLand`/solidity re-keyed on `pole` — this was a REAL DEFECT FIX, not just a rename, since a centre-keyed early-IN returned true before the polygon was ever consulted, painting open bay water as land on a hook island with no downstream exact test able to undo it. 3,302 tests pass (560 shared / 963 server / 1,779 client); `npm run check` green. Scratch prototype dirs (`tmp-fbm/` etc.) deleted before the PR, per the spec's own instruction that they break lint. Known open item, deliberately not fixed: islands CLUSTER (natural noise behaviour, a parameter not an architecture defect — leave as-is unless Eric rules otherwise)."
