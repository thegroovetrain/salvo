next_expected: 'INTERSTITIAL cycle 93 (0.17.93) landed most recently: FRAGMENTATION CASING IS DELETED — epic-6 amendment 23, PV 38->39. Eric: *"Remove the cannon blast radius card altogether."* `cannonBlast` leaves the catalog entirely (34 lines now; cannon subdeck 12 -> 7; a battleship deck 60 -> 55). WHY DELETED RATHER THAN TUNED: ARMOR-PIERCING SHELLS hardcodes burstRadius 0, so for any AP build the card multiplied ZERO by 1.1 and did nothing at all, five times over — a player on AP could be offered it, spend a banked level, and fit five copies for literally no effect, with no disclosure anywhere. The alternatives were a deck-time exclusion or a burst floor under AP; the first adds conditional deck composition for a card nobody chose on purpose, the second rewrites AP''s whole identity (the cannon stops bursting) to rescue a card whose only job was scaling a number AP sets to zero. NOTHING ELSE MOVED: cannon.burstRadius is untouched as a STAT (still 30u base, still 0 under AP) and stays on BOON_STAT_PATHS with no card behind it — the established shape, matching gun.burstRadius, gun.contactDamage, cannon.contactDamage and the seven reloadMs paths. CONSEQUENCE WORTH NAMING, untuned because it follows from the deletion rather than a separate decision: the cannon subdeck is now the THINNEST equipment subdeck at 7 cards (5 commons + 2 exclusives) against torpedoes 12, starShells 12, mines 22 — so a battleship sees cannon cards less often AND its doctrine choice arrives sooner on average, the two exclusives now being 2/7 of that subdeck rather than 2/12. THREE DEAD-CARD FINDINGS REMAIN UNRULED from the boon-cards investigation: mineDamage x minePropFouling is PICK-ORDER dependent (53 vs 45 hp for identical cards, both writing mine.damage into a list-ordered fold), mineTrigger''s 5th card is ~75% eaten by the triggerRadius <= blastRadius clamp when no mineBlast is held, and at most 1 of 6 acquisition cards can ever fire. PRIOR CYCLE: INTERSTITIAL cycle 92 (0.17.92): THE