superseded_next_expected_6: 'STORY 6-3 (THE PARTICIPANTS-ONLY WIN CHECK) LANDED as cycle 89 (0.17.89), PROTOCOL_VERSION 36->37, epic-6 amendments 13-18. THE STORY WAS ~80% ALREADY DONE WHEN IT STARTED and the gate said so: 5-1 removed the drone win-gate (epic-5 amendment 4), 5-2 gave it latch-then-hold, 5-6 excluded PvE fleets, and all three of the AC named tests already existed and passed. The orchestrator RECOMMENDED gap-close-and-mark-done; ERIC OVERRODE IT and took the full participant seam (amendment 13) — recorded as an override, not agreement. WHAT THE SEAM ACTUALLY BUYS, narrower than it looks and worth knowing before 6-4: ShipRecord.isDrone is gone, replaced by role: ShipRole (captain | fleet) plus three predicates in the new server/src/game/participants.ts. But isParticipant is defined as role !== fleet, i.e. EXACTLY !isFleetHull for every present and future role, so those two can NEVER disagree and every site keyed on either gives identical answers even after bot lands. THE ONLY PREDICATE THAT CAN DIVERGE IS isHuman, AND IT HAS EXACTLY TWO READERS — World.queueDenial (a denial needs a socket at the other end) and Match.humanCount (FR34: the countdown must count people, never bots). So Story 6-4 audits THOSE TWO SITES plus any new site it adds, rather than re-auditing sixty; the fleet/participant pair is a READABILITY win (a site now says which question it asks) carrying no behavioural risk. Adding bot to the union is a one-line change and every predicate is already correct for it. ALSO LANDED: a draw stops looking like a loss (amendment 14 — it rendered in amber, byte-identical to a defeat, and the spectate line read MATCH OVER; it now takes the DESIGN.md info token and reads DRAW - SPECTATING); match.end gained an explicit outcome discriminator and LOST endedBy lastHumanLeft, which had been unreachable through any real socket session since the drone-gate removal and took the whole WinTrigger type with it (amendment 16); and a stranded survivor of a collapsed cohort now goes HOME AND RE-QUEUES AUTOMATICALLY with no page reload (amendments 15/17/18, new arena channel MSG.requeue rq, which is why PV moved — amendment 6 held it at 36 only because the 6-1 channels ride the QUEUE room). ONE ERIC REVERSAL MID-CYCLE WORTH NOT RE-PROPOSING: amendment 15 first ruled the survivor re-enters the QUEUE at FRONT-of-pool; the orchestrator surfaced that this needs either a client-asserted flag (a trivial queue-jump exploit) or cross-room state D8 forbids assuming, and Eric replaced it with home-plus-auto-requeue (amendment 18) — "That does not provide any player value." StandardQueueRoom.ts and queue.ts are therefore BYTE-IDENTICAL and there is NO privileged queue position anywhere in the system. Do not reintroduce one. THE REVIEW GATE WAS CROSS-MODEL AND CODEX FOUND WHAT THE IN-FAMILY REVIEWER MISSED — both findings CONFIRMED by reading the code: the requeue try/catch was not actually fail-closed (String(err) inside the catch HANDLER throws on a non-Error value, so the exception escaped and the unconditional disconnect never ran, stranding the room the guard exists to protect), and the old room BINDINGS survived the in-place teardown (Game.disposers collected resize/visibility/wheel/ticker but never bindRoom, so the 1000ms leave() race this story deliberately added could let an abandoned-but-live room deliver late results/sunk/frame events into callbacks closed over a destroyed stage). Both fixed with regression tests. THREE THINGS LEDGERED RATHER THAN FIXED, all in deferred-work.md: a sealed 2-captain room whose second captain NEVER BOARDS still has no escape (the collapse path fires only from countdown, not waiting — the new requeue hook is the obvious fix, left alone because widening the trigger is a lifecycle change deserving its own review); the spectate banner has no hue channel at all (render/hud.ts SPECTATE_STYLE hardcodes amber for every outcome, so the draw is distinguished there by COPY alone — pre-existing, not a regression, but the asymmetry now reads as a bug); and the isHuman-is-the-only-divergence finding above. STILL OPEN AND UNCHANGED BY THIS CYCLE: 6-4 must REBUILD the AR18 batch-sim capability epic-5 amendment 41 deleted (its own "bot quality is measured, not felt" AC has no implementation behind it, and Story 7-6 release gate names loadTest.mjs); 6-5 owes the SOLO TERMINATION RULE amendment 4 created (drones can never win and a human can no longer lose to them by attrition, so a human-versus-drones match has no defined end — minHumans=2 is the only thing hiding it, and amendment 10 collapse behaviour should be revisited if that rule lands); 6-2 is CANCELLED. NEXT is 6-4 (Combat-Bot AI) on the retro "there is always a game" spine, then 6-5, then 6-6. AND STILL THE SINGLE HIGHEST-VALUE ACTION, now carrying a fifth epic of eye-dependent claims: a full-roster MULTIPLAYER PLAYTEST — this cycle adds the boarding presentation, the draw banner and the auto-requeue teardown, none of which any test can judge and the last of which a human should watch rebuild the stage at least once. SUPERSEDED CONTEXT below is retained for the record only.'
superseded_next_expected_5: 'STORY 6-2 (ROSTER-SCALED OCEANS) IS CANCELLED — Eric ruling 2026-08-15, epic-6 amendments 11-12. No code shipped; the cycle is a question gate plus its closeout, so no version was consumed. "We wont be scaling the map size." THE OCEAN IS A FIXED 2800u DISC AND ALWAYS HAS BEEN, which is the counter-intuitive part every prior handoff got wrong: the roster-scaling machinery is fully plumbed — mapRadius(cap) = baseRadius * sqrt(cap / capRef), the generateMap(seed, playerCap) parameter, and WelcomeMsg.playerCap already on the wire — but capRef EQUALS playerCap and ArenaRoom builds its World with that constant, so the square root is always sqrt(1) and the function has only ever returned baseRadius. That was equally true at 900u (capRef 6) and 2400u: a lobby that filled to 20 always got the same ocean a lobby of 2 got. So EVERY PRIOR next_expected CLAUSE SAYING "6-2 must replace the hard-coded baseRadius 2800 with a curve" WAS WRONG TWICE — the curve exists, and it is not wanted. The machinery is KEPT rather than deleted (it costs nothing, the wire field ships at PV 36, and TEAMS would reopen sizing in the OPPOSITE direction — up to 60 hulls wants a BIGGER ocean); feeding it a real roster is a one-argument change at ArenaRoom, and Story 6-1 already supplies the input (expectedCaptains, sealed at forming by amendment 10). Do not do it without a fresh ruling. WHY IT WAS DECLINED, measured across rosters 2-20 on three seeds: generation is valid at every size and land coverage holds at ~2.5%, so nothing blocked it technically — but at cap 2 the map would be 885u, where the FIXED 660u endgame ring is already 56% of the water at 0:00 (vs 5.6% at cap 20) and radar reaches 75% of the map radius (vs 24%), so the storm stops being a pacing instrument and Epic 4 sensor calibration loses its 2800u premise. FR27 map clause closes as wont-do; its spawn half already ships and was verified here (spawn-ring chord 701u at cap 20, 1417u at cap 2, above radar range at every size). ONE LIVE GAP FOUND AND LEFT UNRULED: CONFIG.fleet.waves is ABSOLUTE — 36 PvE hulls at 1:00 whether the match has 2 captains or 20 — while epic-5 amendment 45 rationale reads "a RATIO, one fleet per ~5 captains". That contradiction is in shipped code TODAY and is not map-related. Recommended default is CHANGE NOTHING (the table is what fills a 2800u ocean for a thin lobby; the ratio language was justifying a 20-captain XP budget, not stating a law), and the hazard is the WORDING, which will tempt a future agent to "fix" the table. Needs eyes on the water, not analysis. Full reasoning: epic-6 amendment 12. PRIOR CYCLE: STORY 6-1 (QUEUE-BASED LOBBIES) LANDED as cycle 88 (0.17.88), PV unchanged at 36, epic-6 amendments 1-9. The lobby has moved OUT of the arena: captains pool in StandardQueueRoom, the pool arms at the 2nd captain, and a match forms on a 2:00 hard deadline or at cap 20 — then everyone is seated at once and BOARDS a frozen start line (helm/weapons/radar locked) until all loaders arrive, then a 0:10 countdown. Eric ruled all of that in-session (amendments 1-4 and 8; amendment 8 REVERSED an orchestrator ruling that no everyone-loaded gate was needed). THREE THINGS THE NEXT AGENT MUST KNOW. (a) SEAT RESERVATION BYPASSES onAuth — verified in @colyseus/core 0.17.10 — so the PROTOCOL_VERSION gate and the Story 0.3 JOINING-deadline guard now live on the QUEUE door, and ArenaRoom.onAuth has become the arena''s DEV-ONLY door (HC_DEV_OPTIONS). Any future room that seats players by reservation inherits this trap. (b) ONE PLAYER CAN NO LONGER REACH AN OCEAN AT ALL, so a dev escape ships with the story: npm run dev now sets HC_DEV_OPTIONS=1 and the client honours ?direct=1 under import.meta.env.DEV (amendment 9). Story 6-5 is the honest fix and this makes it MORE beta-critical, not less. (c) The queue does NOT solve the lobby-convergence complaint the ledger homed here (deferred-work.md:365) — that scatter was caused by the 45s hard deadline, not room topology; the timer is the lever and it is now 2:10 (amendment 7). STILL OPEN FROM EPIC 5, unchanged by this cycle: 6-4 must REBUILD the AR18 batch-sim capability amendment 41 deleted; 6-5 owes the solo-termination rule; 6-2 is CANCELLED (see the head of this entry) so its clause here is DISCHARGED, not open. AND STILL THE HIGHEST-VALUE ACTION: a full-roster MULTIPLAYER PLAYTEST — now with a fourth epic of eye-dependent claims, plus this cycle''s entirely unverified-by-eye boarding presentation. PRIOR CONTEXT: EPIC 5 IS CLOSED and its retrospective has landed (_bmad-output/implementation-artifacts/epic-5-retro-2026-08-14.md). 4/6 stories shipped; 5-4 Fog Banks and 5-5 Whirlpools are DEFERRED by Eric ruling — numbers reserved, not cut — and the same ruling declares the SYSTEMS LAYER COMPLETE: "i have enough systems." Full record: epic-5 amendment 47. THAT IS A PHASE RULING, NOT ONLY A SCOPE ONE — a new mechanic from here needs a fresh ruling, and "it was in the epic plan" is no longer sufficient grounds. NEXT IS EPIC 6 (Honest Lobbies & Modes), BUT ITS INTERNAL ORDER IS AN OPEN ERIC RULING. The retro''s recommendation is to resequence around the "there is always a game" spine — 6-1 (queue lobbies) -> 6-4 (combat bots) -> 6-5 (Solo vs AI) -> 6-6 (mode select + queue liveness), with 6-3 folded in (mostly discharged already: amendment 4 dropped the drone gate in 5-1 and amendment 9 made results captain-only, so only formal multi-mode coverage remains) and 6-2/6-7 after. The reasoning: CONFIG.match.minHumans = 2 means ONE PLAYER CANNOT START A MATCH, and at beta launch population is zero — Solo vs AI is the ratified answer and is therefore the beta''s critical path. THREE STORIES ON THAT PATH CARRY DEBT CREATED IN EPIC 5, all to be named at create-story time rather than discovered at a review gate: (a) 6-4 must REBUILD the AR18 batch-sim capability amendment 41 deleted with the drone fill — its own "bot quality is measured, not felt" AC has no implementation behind it, and Story 7-6''s release gate depends on loadTest.mjs by name; the new fleet AI is NOT reusable as bots (6-4''s may read only perception.observe()). (b) 6-5 owes the SOLO TERMINATION RULE amendment 4 created — drones can never win and a human can no longer lose to them by attrition, so a human-versus-drones match has no defined end; minHumans=2 is the only thing hiding it. (c) [DISCHARGED 2026-08-15 — 6-2 is CANCELLED, see the head of this entry; retained because its reasoning was wrong in a way worth not repeating] 6-2 was said to owe a curve replacing amendment 42''s hard-coded baseRadius 2800 — but the curve already existed and was always evaluated at sqrt(1), so the debt was mis-stated; the closing-rate band stays a literal against a fixed radius and needs no re-derivation. The regionWavelength note was ALSO stale — it tracks CONFIG.map.baseRadius rather than a 2400u literal, so it spans the current disc once as intended; it was probed anyway during the 6-2 gate (scaling it to a smaller real radius moved cap-2 island count 1.3 to 2.0 and cap-4 5.3 to 6.0 — real but small) and is moot now that the radius never varies. TWO EPIC-7 ITEMS BECAME URGENT RATHER THAN FINAL-POLISH: 7-4 (How-to-Play) now also owns the win-condition gap amendment 46(c) opened — the objective is stated NOWHERE a new player can read it, which is a first-run defect in the epic where beta readiness was declared the priority; and 7-1''s NFR1 whole-frame verdict now carries TWO epics of unmeasured render growth (epic-4''s radar instrument plus epic-5''s 2800u ocean, up to 63 fleet hulls, and a whole-disc reveal chart). A cheap early read is worth taking before the reference device arrives. AND THE SINGLE HIGHEST-VALUE ACTION IS NOT A STORY: a full-roster MULTIPLAYER PLAYTEST. It is the only instrument that discharges a THREE-EPIC backlog of eye-dependent claims in one sitting — BB endgame share, terminal-ring island pockets, wake legibility under clutter, degradeAlphaFactor, "threat channels read first", plus epic-5''s entire visual layer (reveal framing and the motion:off snap, the sinking settle / kill flash / plume, the aggro bracket at the edge of the bubble, fleet spacing, 2800u ocean feel) and the two-human sinking-window duel the feature was actually designed for. ALSO OVERDUE: the deferred-work triage pass, now TWO epics carried (220 entries, 10 resolved, none triaged since 2026-07-18) — it should be an explicit interstitial cycle rather than a good intention. And NINE small Eric calls are batched in the retro''s action 8; each is a sentence and most have their evidence already captured. SUPERSEDED CONTEXT below is retained for the record only.'

superseded_next_expected_4: 'INTERSTITIAL cycle 87 (0.17.87) landed most recently: HOME TAGLINE — NAUTICAL PUNS — the fixed home-wordmark tagline LAST HULL FLOATING WINS is replaced by a uniform draw from a frozen 20-entry Eric-approved pun pool, picked fresh on every home mount and on every return to port (a rotate-on-a-timer option was offered and declined, so nothing should later add motion to that slot); the win-condition line leaves the home page entirely and does not join the pool; client-only, PV unchanged at 36. Full record: epic-5 amendment 46. It was authored as cycle 85 / amendment 45 and RENUMBERED TWICE on rebase — the PvE fleet rebalance took 85 and the home-scene-variety cycle took 86 — the same collision cycles 83 and 84 hit. ONE OPEN ERIC CALL it leaves: ruling (c) was taken on the stated premise that HOW TO PLAY carries the win condition, and that premise is FALSE — that control paints the FIELD MANUAL ARRIVES IN A LATER REFIT stub, so the objective is now stated nowhere a new player can read it (the results banner is winner-only). The ruling stands as given; it is worth re-putting on a corrected premise. Ledgered in deferred-work.md. epic-5 story cycle — create-story 5-4 (Fog Banks) or 5-5 (Whirlpools). INTERSTITIAL cycle 86 (0.17.86) landed just before it: THE HOME SCENE IS A DIFFERENT OCEAN EVERY LOAD (Eric ask). Both seeds are now rolled per page load with `?homeseed=<n>` to reproduce any scene and the chosen seed logged, because randomising costs REPRODUCIBILITY and the darkening was tuned by eye against captures. Randomising also turned every seed-dependent property into a claim about oceans nobody has looked at, so they were MEASURED: a 40-ocean sweep of the pre-fix build put a rival past base radar range on 5 of them (worst 763u vs 660u), where it stops painting and is simply missing with no cue. Cause was ANCHOR SEA ROOM (180u while the formation orbits to 528u), not the band arithmetic the ledger suspected; `anchorClearU` is now DERIVED from the formation radius, the outer band is pulled in, and an escape-cone leash biases the escape heading homeward past 72% of radar range WITHOUT weakening the grounding clause. 60 oceans: zero off-scope, zero grounding, worst range 550u. A 20-seed sweep is now a real test, proven in BOTH directions (it fails on the old config naming the exact seed) and given an explicit timeout after it flaked at vitest''s 5s default under parallel load. Client-only, PV unchanged at 36. epic-5 story cycle — create-story 5-4 (Fog Banks) or 5-5 (Whirlpools). INTERSTITIAL cycle 84 (0.17.84) landed most recently: THE HOME SCENE — the pre-join menu backdrop was rebuilt from the Story-1.14 fakes (drifting ellipse "islands" in the retired islandFill/islandStroke yellow, viewport-FRACTION geometry, anonymous sprite dots) into a real, seeded, WORLD-UNIT slice of the game driven by the SHIPPED renderers: generateMap terrain in the hypsometric ramp, the real Radar in `return` grammar with the height raster and wake sources wired, ShipView hulls on stepShip kinematics laying real wake, the real Fog and Camera. Split PURE composer (render/ambientScene.ts, unit-tested) + Pixi shell (render/ambient.ts); applyCamera extracted from main.ts to render/stage.ts so both sides share ONE transform; the scene now honours the motion setting (a gap the old ambient carried since the setting shipped); islandFill/islandStroke deleted with their last consumer (the DESIGN.md:41 "provisional carry-over" Open Question is resolved BY DELETION — doc-sync ledgered). Client-only, PV unchanged at 36, no combat/storm/HUD on the menu (the combat-on-the-menu question is an Eric call, ledgered). VERIFIED BY EYE: screenshots reviewed at 1366x768 and 1920x1080, plus live join smokes. THE REVIEW GATE CAUGHT A CRASH NO TEST DOES: freeing GPU texture SOURCES while sweeping the layers the scene BORROWS killed the next match (terrain drawn, no HUD, no hull, stopped loop, TypeError out of BindGroup.getResource under AlphaMaskPipe); the flag is off and ambient.ts records why plus what a correct retry looks like — free through each owner''s seam, and smoke a real join. It merged ON TOP of cycle 83 and renumbered around it (this cycle was authored as 82, which cycle 82 took first). epic-5 story cycle — create-story 5-4 (Fog Banks) or 5-5 (Whirlpools), both DEFERRED by Eric at the 5-6 invocation rather than cancelled. Story 5-6 (Roving PvE Fleets + the bigger ocean) LANDED as cycle 83 (0.17.83), PV 35->36, epic-5 amendments 33-44 — see sprint-status.yaml + epic-5-context-amendments.md. It merged ON TOP of cycles 80/81/82 and renumbered around them: its amendments were authored as 32-43 and its PV as 35, both of which cycle 81/82 took first. Three open Eric calls it leaves: the one-hit-kill guardrail is now scoped to player-piloted CLASS hulls only (a base cannon or torpedo one-shots a 60hp small fleet hull); SunkEvent.vcls is stamped for EVERY victim rather than fleet-only; and the whole cycle is UNVERIFIED BY HUMAN EYES — fleet spacing, whether the aggro bracket reads at the edge of the bubble, and whether a 2800u ocean feels emptier between fights are all eye questions no test answers. Story 5.4 (Fog Banks) still must not be specified until its radar interaction is re-derived against the shipped physical return model.'
