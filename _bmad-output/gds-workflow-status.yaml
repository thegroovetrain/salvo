ENTITY growth. It is FILL RATE. 68 hulls and 20 hulls cost the same (67.2 vs 66.7ms); dpr 1 vs dpr 2 is 16.7 vs 67ms; the shipped HOME SCREEN with no match shows the same 50.8ms. CPU was idle — 7ms of callbacks inside a 67ms frame. Pooling/batching/decay caps cannot move this; overdraw and resolution can. A cost-only benchmark structurally cannot see any of it. OPEN, NEEDS ERIC: integrated-only hardware runs ~12-15 FPS and NFR1 as amended does not cover it — supported path for beta, or out of scope? NFR2: ~3.1s to interactive home of a ~10s budget (309kB gzipped over 9 files), leaving ~7s for the ad/analytics/consent scripts 7-2 and 7-4 add; both must re-run client/scripts/loadCapture.mjs rather than re-derive a method. "Fonts don''t block first paint" is demonstrated by BLOCKING the font CDN, not inferred from timings; the font fix itself claims no measured improvement, honestly recorded. NEXT: Story 7-2 (analytics, consent & privacy). Note its AC text still says "given the static site from 7.1" — a leftover from before the resequencing; the split is now 7-7, so 7-2 lands on the current single-service topology.'

superseded_next_expected_7: 'INTERSTITIAL cycle 95 (0.17.95) landed most recently: THE MINE-CARD RULINGS — epic-6 amendment 25, PV 39->40. It merged ON TOP of cycle 94 (the PvE fleet rebalance) and renumbered around it. Eric: *"remove damage decrease for the fouling mines. tie the trigger radius to the blast radius, combine the cards, so picking it up increases both."* Three changes that between them close TWO of the three dead-card findings the boon-cards investigation left open. (1) PROP-FOULING no longer pays damage for the slow — the bundled mult 0.6 on mine.damage is deleted. That also retires the PICK-ORDER defect: it was the only MULTIPLICATIVE writer of mine.damage against mineDamage''s ADDITIVE ladder, and applyBoonStats folds in list order, so identical cards gave 53 hp or 45 hp depending on draw order. Verified both orders now yield 75. (2) mine.triggerRadius is DERIVED as blastRadius x CONFIG.mine.triggerFactor (2/3), re-pinned in BOTH clampStats and applyBoonStats and REMOVED from BOON_STAT_PATHS. The old min(trigger, blastRadius) CLAMP IS RETIRED — it held the invariant but by silently eating ~75% of the 5th trigger card when no blast card was held (32 -> 51.54 clamped to 48, so the last card bought 1.1u instead of 4.7u). A fixed fraction of the ceiling can never cross the ceiling. Base byte-identical: 48 x 2/3 = 32 exactly. (3) mineTrigger (MAGNETIC -> COMBINATION FUZE) is DELETED and mineBlast grows both rings; the card note says so. COPY NOTE FLAGGED RATHER THAN DECIDED: the surviving ladder is BLAST CASING verbatim because it is attached to the stat that survived; a blend of the two ladders was possible and NOT taken, because re-mixing ratified card copy without a ruling is what the naming law forbids — re-mixing later is a one-line change. BALANCE CONSEQUENCES NAMED, NONE TUNED: PROP-FOULING is now a PURE UPGRADE where it used to be a side-grade (both mine exclusives are pure adds now, so they stay side-grades to each other but taking a doctrine at all is strictly correct); max reachable trip ring is UNCHANGED at 51.54u so the creepAcquireRange guardrail holds at the same numbers; and the mine subdeck loses 5 cards (22 -> 17) so a Mine Layer sees mine cards less often and reaches its doctrine choice sooner — the same pacing shape amendment 23 recorded for the cannon. ONE DEAD-CARD FINDING REMAINS UNRULED: at most 1 of 6 acquisition cards can ever fire (one extra slot; consumeAcquisition purges the rest). PRIOR CYCLE: INTERSTITIAL cycle 94 (0.17.94): THE PvE FLEET REBALANCE — epic-6 amendment 24, PV unchanged at 39. Eric retuned Story 5.6''s fleets on two axes at once: they were HARD TO FIND (*"finding them on a big map can be a pain! even with 7 players"*) and their envelope did not match the attrition role. Drone hp 60/75/90 -> 45/60/75 and gun damage 1/2/3 -> a FLAT 1, which is a DERIVATION not a flattening: the drone reload equals the captain gun reload, so volleys-back == shots-to-kill == 3/4/5, making damage 1 satisfy a per-size damage spec exactly. TTK is now 3/4/5 base-gun shots = 15/20/25s. Tiers 1/4-1/3-1/2 -> 1/4-1/2-3/4, all DYADIC, which is why amendment 33''s fleetLevels()===3 pin was RETIRED rather than re-fitted (it existed because 1/3 could pay float dust; every integer composition is now exact). Eric ruled NO HARDCODED XP TOTAL anywhere in the contract — XP is computed from composition x tiers, and the surviving pin is that the TIERS stay exactly representable. The spawn unit HALVED to 6 hulls (1 large + 2 medium + 3 small) and wave counts DOUBLED to 8/4/2 groups; Eric derives this as a 12-hull fleet split in half, but THAT 12-HULL FLEET DOES NOT EXIST IN CODE ("keep fleet = 6 hulls"; a rename to squadron was offered and declined). The halves are FULLY INDEPENDENT anchors — pickFleetAnchor''s max-min score already spreads them, so pairing was declined. spreadU 400->500. THE FAUCET GROWS 21 -> 35 LEVELS, ~1.8x the 19 levels of captain kills a full lobby offers — put to Eric explicitly and CONFIRMED; pveKillsByClass is the evidence that settles whether it matters, and is the number to re-derive from if the economy reads wrong in playtest. THE MINE LAYER RULING: 45hp puts the small hull under the base mine''s 55 damage, so a base mine now one-shots it (at 60hp only a STACKED mineDamage build could). Surfaced as a consequence and Eric ruled it a FEATURE — *"the minelayer is a fleet-killing machine... can secure it an XP bonus to rely on in fights"* — so it is pinned as a ratified buff. Amendment 36 clause 3 (a mine hit does not aggro its victim) is UNTOUCHED. The GUN must never cross this line and does not (15 < 45). ORCHESTRATOR CORRECTION forced by the spreadU ruling: ring containment was an ARITHMETIC COINCIDENCE between spreadU and FLEET_ANCHOR_MIN_FRACTION (the floor bites below spreadU/0.65 — 615u at 400, 769u at 500 — and at the 660u terminal ring permitted a hull 731u from centre, in the storm). fleetOffset now tests live-ring containment per hull; regression test included. PROTOCOL_VERSION HELD AT 39 on audit: the client never reads CONFIG.drones.hp/.gun, CONFIG.xp or CONFIG.fleet in any production path, and never reads welcome.config at all (it uses its bundled copy) — only .hull dims, untouched. CORRECTION OF RECORD: the cycle-92 claim below that *"Eric''s main checkout is MISSING the server''s core dependencies (colyseus, @colyseus/schema, @colyseus/tools are absent from node_modules)"* is FALSE and should not be repeated — they are installed WORKSPACE-LOCAL under server/node_modules/, which is standard npm workspaces layout; a root-level ls or a package-lock grep for "node_modules/colyseus" looks empty and misleads. What IS true is the second half: a fresh worktree has no node_modules and no shared/dist, so npm ci AND npm run build -w shared are both required before the server type-check resolves @salvo/shared. PRIOR CYCLE: INTERSTITIAL cycle 93 (0.17.93): FRAGMENTATION CASING IS DELETED — epic-6 amendment 23, PV 38->39. Eric: *"Remove the cannon blast radius card altogether."* `cannonBlast` leaves the catalog entirely (34 lines now; cannon subdeck 12 -> 7; a battleship deck 60 -> 55). WHY DELETED RATHER THAN TUNED: ARMOR-PIERCING SHELLS hardcodes burstRadius 0, so for any AP build the card multiplied ZERO by 1.1 and did nothing at all, five times over — a player on AP could be offered it, spend a banked level, and fit five copies for literally no effect, with no disclosure anywhere. The alternatives were a deck-time exclusion or a burst floor under AP; the first adds conditional deck composition for a card nobody chose on purpose, the second rewrites AP''s whole identity (the cannon stops bursting) to rescue a card whose only job was scaling a number AP sets to zero. NOTHING ELSE MOVED: cannon.burstRadius is untouched as a STAT (still 30u base, still 0 under AP) and stays on BOON_STAT_PATHS with no card behind it — the established shape, matching gun.burstRadius, gun.contactDamage, cannon.contactDamage and the seven reloadMs paths. CONSEQUENCE WORTH NAMING, untuned because it follows from the deletion rather than a separate decision: the cannon subdeck is now the THINNEST equipment subdeck at 7 cards (5 commons + 2 exclusives) against torpedoes 12, starShells 12, mines 22 — so a battleship sees cannon cards less often AND its doctrine choice arrives sooner on average, the two exclusives now being 2/7 of that subdeck rather than 2/12. THREE DEAD-CARD FINDINGS REMAIN UNRULED from the boon-cards investigation: mineDamage x minePropFouling is PICK-ORDER dependent (53 vs 45 hp for identical cards, both writing mine.damage into a list-ordered fold), mineTrigger''s 5th card is ~75% eaten by the triggerRadius <= blastRadius clamp when no mineBlast is held, and at most 1 of 6 acquisition cards can ever fire. PRIOR CYCLE: INTERSTITIAL cycle 92 (0.17.92): THE INTEL RANGE MERGE — epic-6 amendment 22, PV 37->38. `intelTruesight` and `intelRadar` are RETIRED for ONE `intelRange` line (common, x4 copies, x1.15 radar range per card) and `EffectiveStats.sightRange` became a DERIVED field (radarRange/2), re-pinned in BOTH clampStats and applyBoonStats and REMOVED from BOON_STAT_PATHS so nothing can address it again. WHY IT WAS A FIX AND NOT A BUFF: the two lines moved sight and radar INDEPENDENTLY while the 5/8 muzzle/smoke rung was a FLAT 412.5u constant, so two stacks of truesight put your own bubble at 414.0u — past that rung — and both signal rows went informationally dead for their owner. Story 4.9 had moved the rung 6/8 -> 5/8, halving the break point from 4 stacks to 2. Now every rung is a fixed fraction of ONE number and the ordering detect < sight < muzzleFlash < farRadar < radar holds at EVERY stack level BY ARITHMETIC; measured HOLDS at all five, and zero boons is byte-identical to the pre-merge base because CONFIG.vision.radar IS SIGHT*2. THE LADDER SCALES (Eric: *"It scales. Intel range means your detection range on all levels gets further."*) — the mz/sm gates now call ONE resolver `muzzleFlashReach(me)` = me.stats.radarRange * 0.625, which SUPERSEDES epic-4 amendments 15/42/119 on the flat-halo clause. That REMOVES THE ODD ONE OUT rather than adding an exception: 3/8 detect, 4/8 sight and 8/8 radar were already observer-scaled and 5/8 was the only consumed rung that was not; the master perception invariant still has exactly SIX declared exceptions. ANCHORED ON RADAR RANGE, NEVER sightOf — same number, but sightOf is the sole dazzle entry point, so the radar anchor keeps "a flash is a light source, dazzle does not shrink it" true BY CONSTRUCTION. The superseded anti-leak rationale holds for SUBJECT-scaling (a plume encoding the SMOKING ship''s build) and not for OBSERVER-scaling. x4 COPIES IS ALSO A PERFORMANCE RULING: client radar cost is purely quadratic in radarRange across the whole reachable range (the minRayRad clamp does not engage below 2000u), so the copy cap IS the cost cap — x4 tops the worst frame at x3.06 rather than x4.05. `intelSweep` STAYS SEPARATE (a rate, not a range), so intel ends with two lines / 9 physical cards from three / 15 — a smaller nerf than it reads, since the lost weight is almost entirely the deleted truesight line and the USEFUL intel draw is near unchanged (4/53 vs the old 5/59 per slot). Amendment 122''s "knowing trade" is RETIRED: there is no longer a fork between buying reach and buying hearing. TWO TRAPS: the mz/sm verifiers in perception.test.ts are DELIBERATELY independent reimplementations, re-derived BY HAND as radarRange*0.625 separately in each — do NOT refactor them to share a helper or import the production resolver; and goldenFrames snapshots were REGENERATED (verified the only diff is boon ids and redrawn offers, since the deck pool moved 59->53 and every weighted draw with it). STILL NOT FIXED AND EACH NEEDING AN ERIC RULING — the other dead cards the boon-cards investigation confirmed: `cannonBlast` is a TOTAL no-op while `cannonAp` is held (AP hardcodes burstRadius 0, so five Fragmentation Casing cards buy literally nothing), `mineDamage` x `minePropFouling` is PICK-ORDER dependent (53 vs 45 hp for identical cards), `mineTrigger`''s 5th card is ~75% clamped away, and at most 1 of 6 acquisition cards can ever fire. PRIOR CYCLE: INTERSTITIAL cycle 91 (0.17.91) — it merged ON TOP of cycle 90 (the match-start fixes, epic-6 amendments 19-21) and RENUMBERED AROUND IT, having already renumbered once off 89; that is the third consecutive epic in which the rebase-renumbering tax has appeared and it is ledgered in the epic-5 retro. CLIENT FRAME-LOOP CONTAINMENT — the client had NO equivalent of the server''s story-0.3 tick-error containment, and Pixi 8''s ticker clears _requestId BEFORE calling update() and only re-requests the frame AFTER it returns, so ONE escaped throw meant NO FRAME WAS EVER REQUESTED AGAIN: input sampling stops, the server keeps sailing your hull on its last engine order, and the picture freezes on the last painted frame (our listener sits at UPDATE_PRIORITY.NORMAL,