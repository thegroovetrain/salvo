E model — per-material reflectivity coefficient x falloff chosen by target GEOMETRY (point/ship 1/d^4, surface/coast/surf/wake/clutter 1/d^3, volume/storm 1/d^2) — replacing the colour lookup. CLIENT-ONLY: no wire change, no server change, PV stays 30, `silhouette` mode untouched. FOUR THINGS THAT WILL BITE. (1) **THE 7/8 RUNG IS A TARGET, NOT A BRANCH.** `CONFIG.vision.farRadar` (577.5u) now EXISTS and is deliberately unconsumed; 4-10 must fit the falloff curve so a mid-size hull crosses red->blue THERE, as a CONSEQUENCE of the curve. Writing `if (d > farRadar)` — or any comparison against it — in a paint path violates amendment 105 (colour is intensity, never category) and is the wrong implementation of 118. It is the one constant in the codebase whose correct use is to never be read. (2) **THE COEFFICIENT TABLE IN AMENDMENT 106 IS AN EXPLICIT ASSISTANT HANDWAVE** (steel broadside 1.0, rock cliff 0.5, mudflat 0.15, surf 0.06, wake 0.03, clutter 0.02, rain 0.2) — it is the FIRST thing to tune and no balance argument may rest on it. (3) **AMENDMENT 99''S STANDING RULE APPLIES**: per-frame cost is MEASURED at BOTH zoom extremes (USER_ZOOM_MIN 0.5 / USER_ZOOM_MAX 1.5) and REPORTED, never assumed — and amendment 98 requires the pin to be at the PIXI ADAPTER, not the pure rasterizer, because that is exactly where cycle 57''s regression reached production through a green pure-module suite. (4) **AMENDMENT 83 STILL GOVERNS EVERYTHING**: a paint is a HISTORICAL RECORD — position, intensity, band and whether a cell paints at all are decided ONCE at creation from the observer''s state at that moment, and only alpha changes afterward. Check it first whenever adding a radar behavior. Then 4-11 (height-aware shadows — the ONLY story in the arc with real server cost, and the one that resolves amendment 103''s derived-radar-range question and 109''s wake fork; note THE SHADOW DIRECTION IS INVERSE — closer to a low island = LONGER shadow — and reproducing the opposite is a bug), then 4-12 (wakes; torpedo wakes stay TABLED per 110). 4-6/4-7/4-8 remain deferred behind the arc, not cancelled. **SUPERSEDED PRIOR ENTRY (create-story 4-9) follows for provenance:** create-story 4-9 (Epic 4, THE EIGHTHS LADDER) — first of the FOUR-STORY RADAR PHYSICS ARC (4-9 -> 4-10 -> 4-11 -> 4-12) added 2026-08-06 from a live Eric design conversation opened immediately after cycle 59 landed island elevation. **ERIC IS DOING THESE NEXT, BEFORE ANYTHING ELSE IN THE EPIC** ("I am 100% doing them next"); they are NONBLOCKING on 4-6/4-7/4-8, so the Bounty entry below is deferred, not cancelled. THE DESIGN CONTRACT IS AMENDMENTS 100-118 in epic-4-context-amendments.md — those are the rulings, each spec DERIVES from them, and on any apparent conflict the amendments WIN and the conflict is REPORTED, not resolved. The governing intent (amendment 100): realistic radar is the killer feature. **READ 112-118 BEFORE TOUCHING ANY OF THIS**, in particular: (1) **AMENDMENT 100 IS SUPERSEDED IN PART BY 115 and carries a marker saying so.** Realism is the IDEA SOURCE and the tiebreaker on PRESENTATION; FUN WINS ON MECHANICS — Eric: "im not really married to realism, i want semi-realism but fun gameplay." Never cite 100''s "realism is the default" clause as written. The argument for still reaching for physics first is amendment 117''s Doppler blind spot: a genuine mechanic (turn perpendicular and you vanish from the sensor) that nobody would have designed on purpose. (2) **COLOUR IS INTENSITY, NEVER CATEGORY** (105, re-ratifying 77 against the pull of a supplied consumer-radar colour taxonomy). That taxonomy is a BASIS for extrapolating signatures, NOT a spec — most of its entries (fiberglass hulls, kayaks, tugboats, pack ice, buoys) have no referent in this game and must not be invented to satisfy it. Object type may reach colour ONLY through physical properties feeding one intensity scale. (3) **LAND IS SACRED** (116). Sensor upgrades buy REACH; nothing buys its way past terrain. 