ment-81 class, one story later, in a different renderer — dazzle is now plumbed into `Projectiles`); an upper-bound-only perception oracle passing VACUOUSLY when the channel it guards got SMALLER; and a cull copied from the observer path onto the OWNER path, whose rationale was never about owners. PREVIOUSLY — FRACTAL TERRAIN — fBm HEIGHT FIELD (interstitial, dev-auto cycle 59) -> 0.17.59: the cycle-51/52 capsule-offset generator (a 1-3 point skeleton wrapped in a noise-displaced outline) is REPLACED by a genuine fBm height field (Eric ruling 2026-08-06, on seeing the capsule shape: "Really, its that I wanted fractal island generation. You didn't really create fractal..." — the capsule was structurally incapable of a lobe, an arm, a hook or a bay, and carried no elevation). generateMap now thresholds a layered integer-hashed gradient-noise field (fBm + ridged multifractal + a two-scale domain warp) at a rank-selected sea level for the coastline, and higher isolines of the SAME field for RENDER-ONLY contour bands (max 4, each stroked in its solid hypsometric colour and filled with a darker version). **ZERO TRANSCENDENTALS on the generation path** (no sin/cos/pow/exp/hypot) retires the cross-engine V8/JavaScriptCore float-determinism risk carried since cycle 51. **THE STAR-SHAPE INVARIANT IS RETIRED**: a thresholded field has arbitrary topology, so lagoon-freedom now comes from a generation-time closure pass (flood open water from the spawn ring, fill what it cannot reach) rather than a shape clamp, and push-out moves from skeleton-normal to NEAREST-BOUNDARY-POINT (adversarial harness: zero penetrations across 8 deepest pockets x 4 oceans). `Island.skeleton` is DELETED, replaced by `pole` (pole of inaccessibility); `core` is now measured about the POLE rather than the centroid, because on a hook the centroid falls in its own bay and would zero the LOS early-out on exactly the islands where it matters most. The height data is stored as a Uint8 raster (14u cells) plus a