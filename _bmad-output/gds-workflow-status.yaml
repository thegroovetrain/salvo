g mechanism if a bearing-grade sound sensor is ever revived), not physical. (2) **THE WIRE NOW CARRIES A HORN VARIANT ID and exactly ONE horn ships.** Adding horn variants is ERIC-GATED CONTENT (amendment 52) — no cycle may invent them. The audio engine now has a real SAMPLE-LOADING SEAM (`HornVoice = {kind:''synth''} | {kind:''sample'', url}` + `HornBufferCache`), shipped exercised by tests only because no licensed recording exists in the repo; a real horn is a file plus one catalog line with no code, wire, or protocol change, but the ASSET IS ERIC''S TO SUPPLY OR APPROVE. (3) **A NEW SCREEN-EDGE BEARING SURFACE EXISTS** (`client/src/render/foghorn.ts`, in `hudRoot` above `layers.hud`). It is deliberately foghorn-shaped, not sensor-shaped — a revived Story 4-1 must NOT be built on it — but Story 4-8 must decide where it sits in the attention tier table (it is not currently a Tier-1 channel), and 4-6''s bounty announcement should not duplicate it. (4) **THE DENIED-CUE LESSON, for Story 4-7''s twin walk:** the foghorn was found to be the only `denied`-tone site in the client with no visual twin, and Eric resolved it by DROPPING THE CUE (amendment 60) rather than inventing a surface. 4-7 should audit every audio cue site the same way — the twin table proves a cue HAS a twin, it does not prove the twin FIRES. If a horn surface (hotbar chip, emote wheel) is ever added, amendment 60 is the ruling to revisit. (5) **RUN THE CROSS-MODEL (Codex) REVIEW EVEN WHEN THE IN-FAMILY GATE RETURNS build-on-it.** This cycle it caught two CONFIRMED defects the adversarial reviewer missed (a chevron ray cast from the viewport centre while the camera leads 110u ahead of the hull, and a client cooldown mirror that survived respawn while the server''s cleared) — both cross-boundary bugs that neither workspace''s own tests could catch (amendment 61). STILL TO SETTLE WITH ERIC, carried forward: 4-8 must resolve the tier-table <25%-vs-50% doc drift and must not pin a listening-ring Tier-1 cha