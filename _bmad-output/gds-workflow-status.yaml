plicit revival ruling; the cycle-42 global-cooldown rebalance still has no batch-sim evidence pass. Story 6-3 (Participants-Only Win Check) still carries the cycle-45 scope gain — drones must not gate the win, but the naive guard removal makes a solo match finish the instant it activates, so 6-3 must solve solo-mode termination; until it lands, AFLOAT reads captains-only while all drones still gate the ending (Eric-accepted interim). The cycle-48 per-shell damage law also still stands: a multi-barrel click lands one `dmg` per connecting shell and the client''s own-damage feedback is a per-frame AGGREGATE resolved in a pre-pass, so nothing may assume one event per felt hit. Ledger entries worth reading first (deferred-work.md): the four 2026-08-04 Story 4.3 entries, cycle 44''s UX-DR17/amendment-19 doc-drift entry, the three cycle-46 DAMAGE CONTROL entries, and NOW cycle 49''s amendment-50 doc drift for the Eric-gated 7-5 batch (EXPERIENCE.md:179''s unqualified "trail smoke above the fog" is bounded at 495u and is a PLUME not a trail; DESIGN.md:239 needs the two-band tier grammar; epics.md:848''s singular "smoke threshold" is now two). Also still OPEN and Eric-gated from cycle 48: a burst resolving over a hull an earlier shell of the same click just sank emits `sp` rather than `hc`, because `resolved` counts only LIVE victims. **CYCLE 51 (0.17.51, interstitial — THE RADAR REALISM CYCLE, amendments 62-75) LANDED IN PARALLEL WITH 4-5 and changes the ground under 4-6 and 4-8 specifically. PV is now 27 (4-5 took 26; both cycles branched from 25, 4-5 merged first).** The five things that will bite: (a) there are now TWO radar grammars behind two INDEPENDENT server env flags (HC_RADAR_GRAMMAR=silhouette|return, HC_RADAR_IDENTITY=roster|pseudonym), both defaulting to shipped behavior — any new radar-layer surface must work in BOTH, and "the blip" is no longer one thing; (b) **STORY 4-6 IS DIRECTLY BLOCKED**: its Bounty Bloom (DESIGN.md:237) needs personal hue on radar AND a