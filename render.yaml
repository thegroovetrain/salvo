# THIS FILE IS LIVE CONFIGURATION, NOT DOCUMENTATION. Render Blueprint
# `salvobp` (exs-d6vln4sr85hc73beab80) has autoSync ON against this path on
# `main`, so whatever lands here is reconciled onto the real services. Adding a
# service here CREATES it (and starts billing it); changing `plan` here changes
# the instance you are paying for. Nothing is "applied later by hand".
#
# TWO ENVIRONMENTS, ONE FILE (cycle 127):
#   hullcracker      <- branch `main`         -> https://hullcracker.io    (pro)
#   hullcracker-dev  <- branch `development`  -> *.onrender.com            (starter)
#
# The flow is feature -> development -> manual QA on the dev host -> main.
# Note the asymmetry that follows from the Blueprint tracking `main`: an edit to
# THIS FILE only takes effect once it reaches `main`, even though the service it
# describes deploys from `development`.
#
# Every setting declared for `hullcracker` below was read back from the live
# service and matches it, so syncing this file changes nothing about production.
# Stated precisely, because the guarantee is only as wide as what was checked:
# the RECONCILED fields are plan, region, branch, autoDeployTrigger and
# numInstances.
# Production state that remains UNDECLARED here and lives only in the dashboard:
# `domains` (hullcracker.io + the unverified www entry) and `healthCheckPath`
# (currently empty). Both are ledgered in deferred-work.md rather than declared,
# because getting a domains list wrong is the one edit in this file that could
# take the game offline.
services:
  - type: web
    name: hullcracker
    runtime: node
    plan: pro
    region: oregon
    branch: main
    # `autoDeployTrigger: commit`, NOT the `autoDeploy: true` this replaces —
    # that field is DEPRECATED in Render's blueprint spec, and `commit` is its
    # documented equivalent. It is also the value the live API already reports.
    autoDeployTrigger: commit
    # NEVER RAISE THIS, AND NEVER ENABLE RENDER AUTOSCALING. Standing
    # architectural constraint (AR1 / NFR10): Render has no WebSocket sticky
    # sessions, so a second instance actively breaks seat reservation and
    # matchmaking — a client would matchmake against one process and connect to
    # another. The beta posture is ONE vertically scaled instance; horizontal
    # scale-out needs the Redis-backed Presence/Driver that was deferred with
    # it. Declared here, matching the live value, so the constraint lives in the
    # file that is now the source of truth instead of only in a planning doc.
    numInstances: 1
    buildCommand: npm install --include=dev && npm run build
    startCommand: echo "[hullcracker] Checking build artifacts..." && ls server/dist/index.js shared/dist/types.js client/dist/index.html && echo "[hullcracker] Starting server..." && npm start
    envVars:
      - key: NODE_ENV
        value: production
      # THE GA4 MEASUREMENT ID (Story 7.2). Build-time config rather than a
      # literal in source, on the mechanism `VITE_WS_URL` already proves: Vite
      # inlines `VITE_`-prefixed vars at BUILD time, and Render exposes envVars
      # to the build, so this reaches `import.meta.env` in the bundle.
      #
      # THE POINT IS THE ABSENCE ELSEWHERE. A fork, a contributor's `npm run
      # dev`, or any preview build has no ID, so `isGaConfigured()` is false and
      # the entire analytics layer is inert — it cannot report into this property
      # by accident. Setting it HERE is what turns measurement on, and it is the
      # only place it is turned on.
      #
      # Not a secret: a GA4 measurement ID is served in the page to every visitor
      # of any site that uses one. It is committed deliberately, so that "which
      # property does production report to" is answerable by reading the repo.
      - key: VITE_GA_MEASUREMENT_ID
        value: G-LLCR4XRZGG
      # THE ADSENSE PUBLISHER CLIENT (Story 7.4). Same mechanism and the same
      # precedent as the GA4 ID above: Vite inlines `VITE_`-prefixed vars at
      # BUILD time, so this reaches `import.meta.env` in the bundle AND the
      # `hc-adsense` build plugin, which is what injects the loader into
      # `index.html` and emits `dist/ads.txt`.
      #
      # THE POINT IS AGAIN THE ABSENCE ELSEWHERE. With no ID a build injects no
      # ad script, emits no `ads.txt` and uses the null portal adapter — a fork
      # or a local `npm run dev` cannot serve ads against this account by
      # accident, and an `ads.txt` is authoritative by omission, so a wrong or
      # partial one would be strictly worse than none.
      #
      # Not a secret: an AdSense publisher ID is public BY CONSTRUCTION — it is
      # served in the loader URL to every visitor and published verbatim in
      # `ads.txt` at the site root.
      - key: VITE_ADSENSE_CLIENT
        value: ca-pub-8667818947296707
      # THE RESULTS-SCREEN DISPLAY SLOT (Eric ruling 2026-08-19). Its OWN switch:
      # with this unset the game ships the interstitial and no display unit at
      # all — no element, no ad request, no observer. Uncomment and paste the
      # `data-ad-slot` digits once the display unit has been created in the
      # AdSense dashboard; no value is invented here, because an `<ins>` naming a
      # slot that does not exist is answered with silence and would be
      # indistinguishable from a legitimately unfilled slot.
      # - key: VITE_ADSENSE_SLOT_RESULTS
      #   value: <paste the unit's data-ad-slot digits here>
      # THE COMMUNITY LINKS (Eric ruling 2026-08-28). The home screen's underplay
      # row renders DISCORD and REDDIT beside HOW TO PLAY · PRIVACY, and these two
      # keys are the ONLY place their identity lives. THE TEMPLATE IS CODE, THE
      # IDENTITY IS CONFIG: `client/src/ui/communityLinks.ts` owns the shapes
      # `https://discord.gg/{code}` and `https://www.reddit.com/r/{name}/`, so no
      # literal community URL is committed anywhere in the client.
      #
      # SAME MECHANISM AND SAME ABSENCE GATING as the two blocks above: Vite
      # inlines `VITE_`-prefixed vars at BUILD time, and an unset (or malformed)
      # value renders NO ANCHOR AT ALL — no fallback destination exists, so a
      # fork, a preview build or a local `npm run dev` cannot point a stranger's
      # players at Eric's server. Setting them HERE is what turns each link on.
      #
      # Not secrets: a Discord invite code and a subreddit name are public by
      # construction — both are handed out to be shared.
      #
      # LEFT UNSET IN THIS FILE BY RULING (Eric, 2026-08-28, R4): the values were
      # not supplied at build time, and none is invented here. Uncomment each one
      # and paste the real value when ready — the Blueprint is the source of
      # truth, so a value set only in the dashboard is drift (see cycle 127).
      # QUOTE THE VALUES: a bare `on`, `no` or `yes` is a YAML 1.1 boolean to
      # some loaders, and a subreddit named like that would arrive as `true`.
      # - key: VITE_DISCORD_INVITE
      #   value: "<paste the invite code — the part after discord.gg/>"
      # - key: VITE_SUBREDDIT
      #   value: "<paste the subreddit name, without r/>"

  # THE STAGING HOST (cycle 127). A byte-identical build of the `development`
  # branch, on its own hostname, so a feature can be played before it reaches
  # hullcracker.io. Same runtime, same buildCommand, same startCommand as
  # production ON PURPOSE — a staging host that builds differently tests the
  # wrong artifact.
  #
  # PLAN IS THE ONE KNOB WORTH RECONSIDERING. `starter` is the cheapest tier
  # that does not spin down (a spun-down host is useless for QA: the first
  # request eats a cold boot, and an idle Colyseus room dies with the process).
  # It is 0.5 CPU / 512 MB against production's 2 CPU / 4 GB, which is fine for
  # functional QA and NOT representative for performance QA — a 20-hull SOLO VS
  # AI match is the case that will feel the difference. Raise to `standard` or
  # `pro` if a cycle needs to trust its own frame timings.
  #
  # This tier does NOT govern the build. Render runs builds on a separate build
  # instance (`buildPlan`), and production already builds this exact tree on the
  # `starter` build tier while serving on `pro` — so "can a starter box finish
  # the three-workspace tsc plus the Pixi bundle" is answered yes by every
  # production deploy to date, not assumed here.
  - type: web
    name: hullcracker-dev
    runtime: node
    plan: starter
    region: oregon
    branch: development
    autoDeployTrigger: commit # see the note on the production service above
    numInstances: 1 # AR1 again — same reason, and staging must mirror it
    buildCommand: npm install --include=dev && npm run build
    startCommand: echo "[hullcracker-dev] Checking build artifacts..." && ls server/dist/index.js shared/dist/types.js client/dist/index.html && echo "[hullcracker-dev] Starting server..." && npm start
    envVars:
      # LOAD-BEARING, NOT COSMETIC. `app.config.ts` gates `express.static` on
      # NODE_ENV === 'production'; anything else serves no client at all (the
      # site 404s) and mounts /playground and /monitor publicly, unauthenticated.
      # Staging runs the production code path and is differentiated by the two
      # absences below, never by this.
      - key: NODE_ENV
        value: production
      # KEEP THIS HOST OUT OF SEARCH. Nothing in the build carries a robots.txt,
      # a canonical URL or a noindex, so without this the staging host is fully
      # indexable and duplicates hullcracker.io's three pages against the domain
      # AdSense approval is tied to. `X-Robots-Tag` rather than a robots.txt
      # because robots.txt only asks a crawler not to FETCH a URL — one
      # discovered elsewhere can still be indexed from that alone. Unset in
      # production, where the middleware is never even mounted.
      #
      # NEVER ADD THIS KEY TO THE `hullcracker` BLOCK ABOVE, and never set it on
      # that service by hand. It would de-index the real game, and a Blueprint
      # sync does not appear to remove a key once the service has it (see the
      # orphaned HC_RADAR_* pair in deferred-work.md) — so backing it out would
      # need a manual API call plus a production redeploy.
      - key: HC_NOINDEX
        value: "1"
      # THE STAGING PASSWORD. One shared secret, no accounts. Setting it turns
      # on BOTH halves of the gate: a password page in front of everything
      # express.static serves, and a check in both rooms' `static onAuth` so
      # matchmaking and the socket are covered too. An Express-only gate would
      # be a facade — /matchmake/* never enters Express (see stagingGate.ts).
      #
      # ROTATION: change this value and save. Every issued cookie is a digest of
      # the old key, so all of them stop matching at once — everyone is
      # re-prompted and anyone mid-session is refused at their next join. No
      # code redeploy, nothing per-person to clean up.
      #
      # `sync: false` means the VALUE IS NOT IN THIS FILE — Render stores it on
      # the service instead. That is deliberate: a password committed to a
      # public repo is not a password. Set it in the Render dashboard, then hand
      # it to whoever is playtesting.
      #
      # OBSERVED AT FIRST SYNC (2026-08-22), so nobody re-diagnoses it: an
      # UNATTENDED auto-sync cannot resolve `sync: false`, because that setting
      # means "prompt for a value in the dashboard" and a Blueprint sync
      # triggered by a push has nobody to prompt. The sync therefore reports
      # `error` and this ONE key is skipped — while every other field in this
      # file applies normally, which is exactly what happened: the service was
      # created with the correct plan/region/branch/trigger/instances and
      # HC_NOINDEX, and only this key was missing. THE GATE IS INERT UNTIL THE
      # VALUE EXISTS, so the host is open in the window between the service
      # being created and someone setting it. Set the value and the next sync
      # goes green. Not a reason to commit the password.
      #
      # Leave it UNSET to run staging wide open; the whole gate is inert then.
      - key: HC_STAGING_KEY
        sync: false
      #
      # WHAT IS DELIBERATELY ABSENT HERE IS THE POINT, and it is the same
      # argument the two production blocks above make for themselves:
      #
      # VITE_GA_MEASUREMENT_ID is unset, so `isGaConfigured()` is false, no
      # gtag.js is injected and staging traffic cannot land in the production
      # GA4 property and skew it.
      #
      # VITE_ADSENSE_CLIENT is unset, so the build injects no loader and emits
      # no `dist/ads.txt`, and the null portal adapter is selected. This one is
      # not merely tidy: with it set, the dev host would serve an `ads.txt`
      # claiming the production publisher ID from a domain that was never
      # submitted for AdSense approval.
      #
      # VITE_WS_URL is unset on BOTH services, which is what lets one build
      # serve two hosts — `wsEndpoint()` falls through to `wss://{location.host}`
      # and each host talks to its own server. Setting it here would point dev
      # clients at whatever it names, production included.
      #
      # VITE_DISCORD_INVITE and VITE_SUBREDDIT are unset, so staging's home
      # screen shows no community links at all. Nothing is being protected here
      # — they are public values — it is simply that production has none set
      # either yet (Eric ruling 2026-08-28). Set them here to QA the row before
      # the real invite code and subreddit name reach the production block.
      #
      # HC_DEV_OPTIONS is unset. It is tempting on a QA box, but on '1' it opens
      # direct arena joins and honours client-supplied room overrides — QA must
      # exercise the same gate production runs.
