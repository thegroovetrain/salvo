<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HULLCRACKER.IO</title>
  <meta name="description" content="Naval battle royale in your browser. Last hull floating wins.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--
    THE FONT STYLESHEET IS NON-RENDER-BLOCKING (Story 7.1, NFR2). As a plain
    `rel="stylesheet"` this was a hard barrier in front of first paint: the
    browser will not paint until every stylesheet in <head> has resolved, so a
    slow or unreachable Google Fonts CDN held a black page for as long as the
    request took to fail. The load budget is cold-load → interactive home, and
    a third-party CDN must never be able to spend it.

    `rel="preload" as="style"` fetches the sheet at high priority WITHOUT
    blocking, and the onload handler flips it to a real stylesheet the moment it
    arrives — so the faces still apply as early as they ever did, they just stop
    gating the paint. The <noscript> copy keeps the ratified typography for a
    scripting-disabled reader (who has no game to play, but should still get the
    page as designed).

    The two `preconnect` hints stay: they warm the TCP+TLS handshakes to both
    Google hosts, which is what makes the non-blocking fetch land quickly.
  -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" onload="this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </noscript>
  <!--
    THE PRERENDERED HOME NEVER FLASHES (Story 13.1, AC 7). The build writes the
    home's words into the body (`src/seo/`), in flow. `#app` is fixed and now
    opaque in the same void as the body (one literal, two selectors), so on a
    scripted load it covers the block from the first frame until the live home
    removes it. A reader with scripting off gets the <noscript> rule instead:
    no `#app`, and the body may scroll.
  -->
  <style>
    html, body { margin: 0; height: 100%; width: 100%; }
    body, #app { background: #050807; }
    body { overflow: hidden; }
    /* UI is not highlightable (Eric 2026-11-24); typing fields stay selectable. */
    body { -webkit-user-select: none; user-select: none; }
    input, textarea { -webkit-user-select: text; user-select: text; }
    #app { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    #app canvas { display: block; }
  </style>
  <noscript>
    <style>#app { display: none; } body { overflow: auto; }</style>
  </noscript>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
